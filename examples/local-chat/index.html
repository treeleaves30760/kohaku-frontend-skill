<title>KohakuChat</title>
<script>
  // Apply the stored theme (or the system setting) before first paint, so there is no flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    var q = new URLSearchParams(location.search).get("theme");
    if (q === "light" || q === "dark") t = q;
    var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.classList.toggle("dark", dark);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // Kohaku Tailwind preset, inlined (replaces the default palette).
  tailwind.config = {
    darkMode: "class",
    theme: {
      colors: {
        transparent: "transparent",
        current: "currentColor",
        white: "#ffffff",
        black: "#000000",
        sapphire: { light: "#D6E3F8", DEFAULT: "#0F52BA", shadow: "#082567" },
        aquamarine: { light: "#D4EDE8", DEFAULT: "#4C9989", shadow: "#1B6B5A" },
        taaffeite: { light: "#E8D5ED", DEFAULT: "#A57EAE", shadow: "#6B4670" },
        iolite: { light: "#DDD0F0", DEFAULT: "#5A4FCF", shadow: "#312A7A" },
        amber: { light: "#F5E6C8", DEFAULT: "#D4920A", shadow: "#8B5E00" },
        coral: { light: "#F5D5D5", DEFAULT: "#D46B6B", shadow: "#8B3A3A" },
        sage: { light: "#D5E8DA", DEFAULT: "#5A9E6F", shadow: "#3A6B48" },
        warm: {
          50: "#F7F5F2", 100: "#EFECE7", 200: "#E0DBD4", 300: "#C5BFB7", 400: "#A09A92",
          500: "#8A8480", 600: "#6A645F", 700: "#4A4540", 800: "#3A3632", 900: "#2A2724",
          950: "#1A1816",
        },
      },
      extend: {
        fontFamily: {
          sans: ["Inter", "system-ui", "-apple-system", "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "sans-serif"],
          mono: ["JetBrains Mono", "Fira Code", "ui-monospace", "Consolas", "monospace"],
        },
        fontSize: {
          "kt-micro": "var(--kt-fs-micro)",
          "kt-caption": "var(--kt-fs-caption)",
          "kt-body": "var(--kt-fs-body)",
          "kt-emphasis": "var(--kt-fs-emphasis)",
          "kt-title": "var(--kt-fs-title)",
          "kt-h2": "var(--kt-fs-h2)",
          "kt-h1": "var(--kt-fs-h1)",
        },
        backgroundColor: {
          "v2-rail": "var(--v2-rail)",
          "v2-chrome": "var(--v2-chrome)",
          "v2-canvas": "var(--v2-canvas)",
          "v2-panel": "var(--v2-panel)",
          "v2-card": "var(--v2-card)",
          "v2-float": "var(--v2-float)",
        },
        borderColor: {
          "v2-line": "var(--v2-line)",
          "v2-edge": "var(--v2-line-strong)",
        },
        transitionDuration: { DEFAULT: "150ms" },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>
/* ===== tokens.css (Kohaku design tokens) ===== */

  --kt-color-sapphire: #0f52ba;
  --kt-color-sapphire-shadow: #082567;

  --kt-color-warm-50: #f7f5f2;
  --kt-color-warm-100: #efece7;
  --kt-color-warm-200: #e0dbd4;
  --kt-color-warm-300: #c5bfb7;
  --kt-color-warm-400: #a09a92;
  --kt-color-warm-500: #8a8480;
  --kt-color-warm-600: #6a645f;
  --kt-color-warm-700: #4a4540;
  --kt-color-warm-800: #3a3632;
  --kt-color-warm-900: #2a2724;
  --kt-color-warm-950: #1a1816;

  --kt-accent: var(--kt-color-iolite);
  --kt-accent-text: var(--kt-color-iolite);
  --kt-live: var(--kt-color-aquamarine);
  --kt-ok: var(--kt-color-sage);
  --kt-attention: var(--kt-color-amber);
  --kt-danger: var(--kt-color-coral);

  --kt-ok-text: var(--kt-color-sage-shadow);

  --v2-hover: rgb(36 33 29 / 0.07);

  --kt-fs-micro: 0.65rem;

.kt-reading,

}

html.dark {
  --kt-accent-text: var(--kt-color-iolite-light);
  --kt-ok-text: var(--kt-color-sage-light);
  --kt-live-text: var(--kt-color-aquamarine-light);
  --kt-attention-text: var(--kt-color-amber-light);
  --kt-danger-text: var(--kt-color-coral-light);
  --kt-fill-accent: #8b83db;
  --kt-fill-info: #6f9be0;

  --color-bg: #1a1816;
  --color-surface: #252220;
  --color-surface-alt: #1e1c1a;

  --color-text: #e8e0d8;

  --v2-chrome: #1a1816;
  --v2-canvas: #221f1d;

  --v2-card-shadow: none;

  --v2-line: #3a3632;
  --v2-line-strong: #4a4540;
  --v2-hover: rgb(255 255 255 / 0.05);
  --v2-ink: #f3efe9;
  --v2-ink-2: #a39a91;

  --kt-chart-cat-1: #8076e6;
  --kt-chart-cat-2: #25a88e;
  --kt-chart-good: #6db585;
  --kt-chart-warn: #d9a23a;
  --kt-chart-bad: #e07a7a;
  --kt-chart-idle: #6a645f;
  --kt-chart-axis: #8a8078;
  --kt-chart-grid: rgb(255 255 255 / 0.06);
}

/* ===== base.css (Kohaku base layer) ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
button { background: transparent; border: none; color: inherit; font: inherit; cursor: pointer; appearance: none; }
select, input, textarea { font: inherit; color: inherit; }
html {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.6;
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  height: 100%;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overflow-x: hidden;
  touch-action: manipulation;
}
body { height: 100%; overflow-x: hidden; }
code, pre, kbd, .font-mono, .num { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }
.scrollbar-none { scrollbar-width: none; }
.scrollbar-none::-webkit-scrollbar { display: none; }
:focus-visible { outline: 2px solid var(--kt-accent); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: none; }
:where(html:not(.dark)) .text-warm-400 { color: #77706a; }
:where(html:not(.dark)) .text-warm-500 { color: #655e57; }
.kt-text-micro { font-size: var(--kt-fs-micro); }
.kt-text-caption { font-size: var(--kt-fs-caption); }
.kt-text-body { font-size: var(--kt-fs-body); }
.kt-text-emphasis { font-size: var(--kt-fs-emphasis); }
.kt-text-title { font-size: var(--kt-fs-title); }
.kt-text-h2 { font-size: var(--kt-fs-h2); }
.kt-text-h1 { font-size: var(--kt-fs-h1); }
@media (pointer: coarse) {
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]),
  textarea, select, [contenteditable="true"] { font-size: max(16px, 1rem) !important; }
}
.hover-only-action { opacity: 0; transition: opacity var(--kt-dur-fast) var(--kt-ease); }
.group:hover .hover-only-action, .group:focus-within .hover-only-action, .group.is-selected .hover-only-action { opacity: 1; }
@media (pointer: coarse) { .hover-only-action { opacity: 1; } }
@keyframes kt-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.kohaku-pulse { animation: kt-pulse 1.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
.kt-v2-rail { background: var(--v2-rail); }
.kt-v2-chrome { background: var(--v2-chrome); }
.kt-v2-canvas { background: var(--v2-canvas); }
.kt-v2-panel { background: var(--v2-panel); }
.kt-v2-card { background: var(--v2-card); border: 1px solid var(--v2-line); border-radius: var(--kt-radius-card); box-shadow: var(--v2-card-shadow); }
.kt-v2-float { background: var(--v2-float); border: 1px solid var(--v2-line); border-radius: var(--kt-radius-card); box-shadow: var(--v2-float-shadow); }
:where(.kt-v2-line, .kt-v2-edge) { border-width: 0; border-style: solid; }
.kt-v2-line { border-color: var(--v2-line); }
.kt-v2-edge { border-color: var(--v2-line-strong); }
.kt-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
  height: 2rem; padding: 0 0.75rem; border-radius: var(--kt-radius-control);
  font-size: var(--kt-fs-body); font-weight: 500; white-space: nowrap; user-select: none;
  transition: background-color var(--kt-dur-fast), border-color var(--kt-dur-fast), color var(--kt-dur-fast);
}
.kt-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.kt-btn--primary { background: var(--kt-color-iolite); color: #fff; }
.kt-btn--primary:hover:not(:disabled) { background: var(--kt-color-iolite-shadow); }
.kt-btn--danger { background: var(--kt-color-coral); color: #fff; }
.kt-btn--danger:hover:not(:disabled) { background: var(--kt-color-coral-shadow); }
.kt-btn--secondary { background: var(--v2-panel); border: 1px solid var(--v2-line-strong); color: var(--color-text); }
.kt-btn--secondary:hover:not(:disabled) { border-color: color-mix(in srgb, var(--kt-color-iolite) 50%, transparent); }
.kt-btn--ghost { color: var(--kt-color-warm-600); }
.kt-btn--ghost:hover:not(:disabled) { background: var(--v2-hover); }
.kt-btn--sm { height: 1.75rem; padding: 0 0.625rem; font-size: var(--kt-fs-caption); }
.kt-btn--icon { width: 2rem; padding: 0; color: var(--kt-color-warm-600); }
.kt-btn--icon.kt-btn--sm { width: 1.75rem; }
.kt-btn--icon:hover:not(:disabled) { background: var(--v2-hover); color: var(--color-text); }
html.dark .kt-btn--ghost, html.dark .kt-btn--icon { color: var(--kt-color-warm-400); }
@media (pointer: coarse) {
  .kt-btn { min-height: 2.5rem; }
  .kt-btn--icon { min-width: 2.5rem; }
}
.kt-chip {
  --gem: var(--kt-color-warm-500);
  --gem-text: var(--kt-color-warm-700);
  --gem-text-dark: var(--kt-color-warm-200);
  display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.375rem;
  border-radius: var(--kt-radius-pill); font-size: 11px; line-height: 1;
  border: 1px solid color-mix(in srgb, var(--gem) 40%, transparent);
  background: color-mix(in srgb, var(--gem) 10%, transparent);
  color: var(--gem-text);
}
html.dark .kt-chip { color: var(--gem-text-dark); }
.kt-chip--iolite { --gem: var(--kt-color-iolite); --gem-text: var(--kt-color-iolite); --gem-text-dark: var(--kt-color-iolite-light); }
.kt-chip--aquamarine { --gem: var(--kt-color-aquamarine); --gem-text: var(--kt-color-aquamarine-shadow); --gem-text-dark: var(--kt-color-aquamarine-light); }
.kt-chip--sage { --gem: var(--kt-color-sage); --gem-text: var(--kt-color-sage-shadow); --gem-text-dark: var(--kt-color-sage-light); }
.kt-chip--amber { --gem: var(--kt-color-amber); --gem-text: var(--kt-color-amber-shadow); --gem-text-dark: var(--kt-color-amber-light); }
.kt-chip--coral { --gem: var(--kt-color-coral); --gem-text: var(--kt-color-coral-shadow); --gem-text-dark: var(--kt-color-coral-light); }
.kt-chip--sapphire { --gem: var(--kt-color-sapphire); --gem-text: var(--kt-color-sapphire); --gem-text-dark: var(--kt-color-sapphire-light); }
.kt-chip--taaffeite { --gem: var(--kt-color-taaffeite); --gem-text: var(--kt-color-taaffeite-shadow); --gem-text-dark: var(--kt-color-taaffeite-light); }
.kt-dot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: var(--kt-neutral); flex-shrink: 0; }
.kt-dot--live { background: var(--kt-live); }
.kt-dot--ok { background: var(--kt-ok); }
.kt-dot--attention { background: var(--kt-attention); }
.kt-dot--danger { background: var(--kt-danger); }
.kt-section-title { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); }
.kt-input {
  width: 100%; height: 2rem; padding: 0 0.625rem; border-radius: var(--kt-radius-control);
  background: var(--v2-card); border: 1px solid var(--v2-line-strong); font-size: var(--kt-fs-body);
  transition: border-color var(--kt-dur-fast), box-shadow var(--kt-dur-fast);
}
.kt-input::placeholder { color: var(--color-text-faint); }
.kt-input:focus { outline: none; border-color: var(--kt-color-iolite); box-shadow: 0 0 0 2px color-mix(in srgb, var(--kt-color-iolite) 22%, transparent); }
.kt-input[aria-invalid="true"] { border-color: var(--kt-color-coral); }
.kt-seg { display: inline-flex; padding: 0.125rem; gap: 0.125rem; border-radius: var(--kt-radius-control); background: color-mix(in srgb, var(--kt-color-warm-200) 50%, transparent); }
html.dark .kt-seg { background: color-mix(in srgb, var(--kt-color-warm-800) 70%, transparent); }
.kt-seg > button { height: 1.5rem; padding: 0 0.5rem; border-radius: 0.375rem; font-size: 11px; color: var(--v2-ink-2); }
.kt-seg > button[aria-checked="true"], .kt-seg > button[aria-pressed="true"] { background: var(--v2-card); color: var(--v2-ink); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.kt-banner {
  --gem: var(--kt-color-coral);
  display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0.75rem; border-radius: var(--kt-radius-control);
  border: 1px solid color-mix(in srgb, var(--gem) 30%, transparent);
  background: color-mix(in srgb, var(--gem) 10%, transparent);
  font-size: var(--kt-fs-body);
}
.kt-banner--attention { --gem: var(--kt-color-amber); }
.kt-banner--ok { --gem: var(--kt-color-sage); }
.kt-banner--info { --gem: var(--kt-color-iolite); }

/* ===== app layer (tokens only) ===== */
html, body, #root { height: 100%; }
body { background: var(--v2-canvas); }
iconify-icon { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: middle; flex-shrink: 0; }
.ink { color: var(--v2-ink); }
.ink-2 { color: var(--v2-ink-2); }
.ink-3 { color: var(--v2-ink-3); }
.c-accent { color: var(--kt-accent-text); }
.c-ok { color: var(--kt-ok-text); }
.c-danger { color: var(--kt-danger); }
.c-attention { color: var(--kt-attention-text); }

/* Icon button: 28px, 40px on touch. */
.ib {
  display: inline-flex; align-items: center; justify-content: center;
  width: 1.75rem; height: 1.75rem; border-radius: var(--kt-radius-control);
  color: var(--v2-ink-2); font-size: var(--kt-fs-body);
  transition: background-color var(--kt-dur-fast), color var(--kt-dur-fast);
}
.ib:hover { background: var(--v2-hover); color: var(--v2-ink); }
@media (pointer: coarse) { .ib { width: 2.5rem; height: 2.5rem; font-size: 1.125rem; } }

/* Rail item. */
.rail-item {
  display: flex; align-items: center; gap: 0.625rem; width: 100%;
  min-height: 2.25rem; padding: 0.25rem 0.75rem; border-radius: var(--kt-radius-control);
  font-size: var(--kt-fs-body); color: var(--v2-ink-2); text-align: left;
  transition: background-color var(--kt-dur-fast), color var(--kt-dur-fast);
}
.rail-item:hover { background: color-mix(in srgb, var(--kt-color-warm-300) 50%, transparent); color: var(--v2-ink); }
html.dark .rail-item:hover { background: color-mix(in srgb, var(--kt-color-warm-700) 50%, transparent); }

<script type="text/plain" id="reply-md">The server file looks right; the failure is only the missing Python binding. Install it, then stream tokens from the OpenAI-compatible endpoint the server exposes.

### 1. Install the binding

```bash
pip install "llama-cpp-python[server]"
python src/serve.py
```

### 2. Stream from the local server

```python
from openai import OpenAI

client = OpenAI(base_url="http://127.0.0.1:8080/v1", api_key="local")

stream = client.chat.completions.create(
    model="qwen2.5-7b-instruct-q4_k_m",
    messages=[{"role": "user", "content": "Hello"}],
    temperature=0.7,
    stream=True,
)
for chunk in stream:
    # each chunk carries a few tokens
    print(chunk.choices[0].delta.content or "", end="", flush=True)
```

### Which quantization to load

| Quant | File size | RAM needed | Quality vs FP16 |
|---|---:|---:|---|
| Q4_K_M | 4.7 GB | 6.9 GB | about 97% |
| Q5_K_M | 5.4 GB | 7.6 GB | about 98% |
| Q8_0 | 8.1 GB | 10.3 GB | near lossless |

- Start with **Q4_K_M** if the machine has 8 GB of RAM.
- Keep `n_ctx` no higher than you need; the KV cache grows with it.</script>

/* ── Tool call row ── */
const TOOL_STATUS = {

  const errLine = p.status === "error" && p.output ? p.output.trim().split("\n").pop() : null;

function AssistantMessage({ m, t, lang, live, onRegenerate, canRegenerate }) {

  const runningTool = m.parts.find((p) => p.type === "tool" && p.status === "running");
  const tokens = m.stats?.tokens ?? 0, elapsed = m.stats?.elapsed ?? 0;
  const rate = elapsed > 0 ? (tokens / (elapsed / 1000)).toFixed(1) : null;
  const nf = fmt(lang).num;
  return (
    <div className="asst group msg-body">
      <div className="flex flex-col gap-3">
        {m.parts.map((p) => p.type === "tool"

/* ── Composer: Enter sends (never during IME composition, never on touch); Send becomes Stop in the same slot ── */
function ContextRing({ used, max, t, lang }) {
  const pct = Math.min(100, Math.round((used / max) * 100));
  const color = pct > 80 ? "var(--kt-color-coral)" : pct >= 60 ? "var(--kt-color-amber)" : "var(--kt-fill-accent)";
  const r = 7, c = 2 * Math.PI * r;
  const nf = fmt(lang).num;
  const title = t("ctxTitle", { used: nf.format(used), max: nf.format(max), pct });
  return (
    <span className="inline-flex items-center gap-1.5 ink-2" title={title} role="img" aria-label={title}>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <circle cx="9" cy="9" r={r} fill="none" stroke="var(--v2-line-strong)" strokeWidth="2.5" />
        <circle cx="9" cy="9" r={r} fill="none" stroke={color} strokeWidth="2.5" strokeDasharray={`${(pct / 100) * c} ${c}`} transform="rotate(-90 9 9)" strokeLinecap="round" />
      </svg>
      <span className="kt-text-micro font-mono num hidden sm:inline">{compact(used)} / {compact(max)}</span>
    </span>
  );
}
function Composer({ value, setValue, onSend, onStop, streaming, model, t, lang, ctxUsed, ctxMax, coarse, taRef }) {
  useLayoutEffect(() => {
    const ta = taRef.current; if (!ta) return;
    ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 128) + "px";
  }, [value]);
  const canSend = value.trim().length > 0 && !streaming;
  const onKeyDown = (e) => {
    if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.nativeEvent.isComposing || e.keyCode === 229 || coarse) return;
    e.preventDefault();

  return (
    <div className="composer px-3 pt-2.5 pb-2">
      <label htmlFor="composer-input" className="sr-only">{t("placeholder", { model })}</label>
      <textarea id="composer-input" ref={taRef} rows={1} value={value} onChange={(e) => setValue(e.target.value)} onKeyDown={onKeyDown}
        placeholder={t("placeholder", { model })} />
      <div className="flex items-center gap-2 mt-1">
        <span className="kt-chip font-mono truncate min-w-0" title={model}>{model}</span>
        <span className="flex-1" />

}

            onChange={(e) => setQuery(e.target.value)} onKeyDown={(e) => { if (e.key === "Escape" && query) { e.stopPropagation(); setQuery(""); } }} />
        </div>

          {SECTIONS.map((s) => (
            <li key={s.id}>
              <button type="button" onClick={() => setSection(s.id)} aria-current={section === s.id ? "page" : undefined}
                className={`w-full h-9 px-3 rounded-lg flex items-center gap-2.5 kt-text-body transition-colors ${section === s.id ? "bg-iolite/10 text-iolite dark:text-iolite-light font-medium" : "ink-2 hover:bg-[color:var(--v2-hover)]"}`}>
                <Icon name={s.icon} />{s.label}
              </button>
            </li>
          ))}
        </ul>
      </aside>
      <div className="flex-1 min-w-0 overflow-y-auto bg-v2-canvas">
        <div className="max-w-4xl mx-auto px-8 py-6">{body}</div>
      </div>
    </div>
  );
}

/* ── App ── */
function App() {
  const [convs, setConvs] = useState(() => (params.get("view") === "empty-list" ? [] : seed()));
  const [activeId, setActiveId] = useState("c1");
  const [view, setView] = useState(params.get("view") === "settings" ? "settings" : "chat");
  const [query, setQuery] = useState("");
  const [drawer, setDrawer] = useState(params.get("drawer") === "1");
  const [drafts, setDrafts] = useState({});
  const [live, setLive] = useState(null); // { convId, msgId }
  const [showNew, setShowNew] = useState(false);
  const [prefs, setPrefs] = useState(() => ({
    model: LS.get("kt.chat.model", MODELS[0].id),
    temperature: Number(LS.get("kt.chat.temperature", "0.7")),
    theme: LS.get("theme", "system"),
    lang: params.get("lang") || LS.get("kt.chat.lang", "en"),
  }));
  const isCompact = useMedia("(max-width: 767px)");
  const coarse = useMedia("(pointer: coarse)");
  const t = useMemo(() => makeT(prefs.lang), [prefs.lang]);
  const eng = useRef(null);
  const scRef = useRef(null), follow = useRef(true), taRef = useRef(null), searchRef = useRef(null);

  const setPref = (k, v) => {
    setPrefs((p) => ({ ...p, [k]: v }));
    const key = { model: "kt.chat.model", temperature: "kt.chat.temperature", theme: "theme", lang: "kt.chat.lang" }[k];
    LS.set(key, k === "theme" && v === "system" ? null : String(v));
  };

  // Theme: system / light / dark; follow the OS while on "system".
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const apply = () => document.documentElement.classList.toggle("dark", prefs.theme === "dark" || (prefs.theme === "system" && mq.matches));
    apply(); mq.addEventListener("change", apply); return () => mq.removeEventListener("change", apply);
  }, [prefs.theme]);
  useEffect(() => { document.documentElement.lang = prefs.lang; }, [prefs.lang]);

  const conv = convs.find((c) => c.id === activeId);
  const draft = drafts[activeId] ?? "";
  const setDraft = (v) => setDrafts((d) => ({ ...d, [activeId]: v }));
  const model = MODELS.find((m) => m.id === prefs.model) || MODELS[0];
  const ctxUsed = useMemo(() => {
    if (!conv) return 0;
    const chars = conv.messages.reduce((n, m) => n + (m.text ? m.text.length : m.parts.reduce((k, p) => k + (p.text || p.output || "").length, 0)), 0);
    return Math.round(chars / 3.6) + 180;
  }, [conv]);

  /* Streaming engine: tokens land in a mutable draft; React sees at most one commit per 80ms. */
  const startReply = useCallback((convId, msgId) => {
    const e = { convId, msgId, parts: [], timers: [], tokens: 0, t0: performance.now(), pending: null, done: false };
    eng.current = e;
    const commit = () => {
      clearTimeout(e.pending); e.pending = null;
      const parts = e.parts.map((p) => ({ ...p }));
      const stats = { tokens: e.tokens, elapsed: performance.now() - e.t0 };
      setConvs((cs) => cs.map((c) => c.id !== convId ? c : { ...c, updated: Date.now(),
        messages: c.messages.map((m) => m.id !== msgId ? m : { ...m, parts, stats }) }));
    };
    const schedule = () => { if (!e.pending) e.pending = setTimeout(commit, 80); };
    const later = (fn, ms) => { e.timers.push(setTimeout(() => { if (!e.done) fn(); }, ms)); };
    e.finish = (status) => {
      if (e.done) return; e.done = true;
      e.timers.forEach(clearTimeout);
      if (status === "stopped") e.parts.forEach((p) => { if (p.status === "running") p.status = "interrupted"; });
      commit();
      setConvs((cs) => cs.map((c) => c.id !== convId ? c : { ...c, messages: c.messages.map((m) => m.id !== msgId ? m : { ...m, status }) }));
      setLive(null); eng.current = null;
    };
    let si = 0;
    const next = () => {
      if (si >= SCRIPT.length) return e.finish("done");
      const s = SCRIPT[si++];
      if (s.type === "text") {
        const part = { type: "text", id: uid("p"), text: "" };
        e.parts.push(part);
        const toks = s.text.match(/\s*\S{1,6}|\s+/g) || [];
        let k = 0;
        const tick = () => {
          part.text += toks[k++]; e.tokens++; schedule();
          if (k < toks.length) later(tick, 14 + Math.random() * 26); else later(next, 250);
        };
        later(tick, 120);
      } else {
        const part = { type: "tool", id: uid("p"), name: s.name, args: s.args, status: "running" };
        e.parts.push(part); commit();
        later(() => { part.status = s.ok ? "ok" : "error"; part.output = s.output; part.ms = s.ms; commit(); later(next, 300); }, s.ms);
      }
    };
    setLive({ convId, msgId });
    next();
  }, []);

  const stop = () => eng.current && eng.current.finish("stopped");
  useEffect(() => () => eng.current && eng.current.finish("stopped"), []);

  const send = (textArg) => {
    const text = (textArg ?? draft).trim();
    if (!text || live) return;
    let id = activeId;
    const userMsg = { id: uid("m"), role: "user", text };
    const asst = { id: uid("m"), role: "assistant", parts: [], status: "streaming", model: prefs.model, stats: { tokens: 0, elapsed: 0 } };
    setConvs((cs) => cs.map((c) => c.id !== id ? c : {
      ...c, title: c.title || cut(text.replace(/\s+/g, " "), 48), updated: Date.now(), messages: [...c.messages, userMsg, asst],
    }));
    setDrafts((d) => ({ ...d, [id]: "" }));
    follow.current = true;
    startReply(id, asst.id);
  };
  const regenerate = (msgId) => {
    if (live) return;
    const asst = { id: uid("m"), role: "assistant", parts: [], status: "streaming", model: prefs.model, stats: { tokens: 0, elapsed: 0 } };
    setConvs((cs) => cs.map((c) => c.id !== activeId ? c : { ...c, messages: [...c.messages.filter((m) => m.id !== msgId), asst] }));
    follow.current = true;
    startReply(activeId, asst.id);
  };
  const newChat = () => {
    const existing = convs.find((c) => c.messages.length === 0);
    const id = existing ? existing.id : uid("c");
    if (!existing) setConvs((cs) => [{ id, title: "", updated: Date.now(), messages: [] }, ...cs]);
    setActiveId(id); setView("chat"); setDrawer(false);
    requestAnimationFrame(() => taRef.current && !coarse && taRef.current.focus());
  };
  const select = (id) => { setActiveId(id); setView("chat"); setDrawer(false); follow.current = true; };
  const openSettings = () => { setView("settings"); setDrawer(false); };

  // Demo hooks for screenshots: ?view=new, ?demo=stream
  useEffect(() => {
    if (params.get("view") === "new") newChat();
    if (params.get("demo") === "stream") {
      const id = "c-demo";
      setConvs((cs) => [{ id, title: "", updated: Date.now(), messages: [] }, ...cs]);
      setActiveId(id);
    }
  }, []);
  const sendRef = useRef(send); sendRef.current = send;
  useEffect(() => {
    if (params.get("demo") === "stream") {
      const timer = setTimeout(() => sendRef.current("How do I serve a GGUF model locally and stream the reply token by token?"), 60);
      return () => clearTimeout(timer);
    }
  }, []);

  // Follow the tail only within 80px of the bottom; one scroll per commit, in rAF.
  const onScroll = () => {
    const el = scRef.current; if (!el) return;
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    follow.current = atBottom;
    if (atBottom) setShowNew(false);
  };
  useLayoutEffect(() => {
    const el = scRef.current; if (!el) return;
    if (follow.current) { const id = requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); return () => cancelAnimationFrame(id); }
    else if (live && live.convId === activeId) setShowNew(true);
  }, [conv, view]);
  useEffect(() => { follow.current = true; setShowNew(false); }, [activeId]);
  // Content also grows after commits (fonts, icons, content-visibility); keep the tail while following.
  const colRef = useRef(null);
  useEffect(() => {
    const el = scRef.current, col = colRef.current; if (!el || !col) return;
    let raf = 0;
    const ro = new ResizeObserver(() => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { if (follow.current) el.scrollTop = el.scrollHeight; });
    });
    ro.observe(col); return () => { ro.disconnect(); cancelAnimationFrame(raf); };
  }, [activeId, view, conv && conv.messages.length === 0]);

  // Keyboard: Ctrl/⌘+K focuses conversation search (wins inside inputs); Esc closes the drawer.
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault(); if (isCompact) setDrawer(true);
        requestAnimationFrame(() => searchRef.current && searchRef.current.focus());
        return;
      }
      if (e.key === "Escape" && drawer && !e.defaultPrevented) setDrawer(false);
    };
    window.addEventListener("keydown", onKey); return () => window.removeEventListener("keydown", onKey);
  }, [drawer, isCompact]);
  useEffect(() => { if (!isCompact && drawer) setDrawer(false); }, [isCompact]);

  const railProps = { convs, activeId, view, onSelect: select, onNew: newChat, onSettings: openSettings, query, setQuery,
    liveConvId: live && live.convId, t, lang: prefs.lang, searchRef };
  const isEmpty = conv && conv.messages.length === 0;
  const streamingHere = !!live && live.convId === activeId;

  const composer = (
    <Composer value={draft} setValue={setDraft} onSend={() => send()} onStop={stop} streaming={streamingHere || !!live}
      model={prefs.model} t={t} lang={prefs.lang} ctxUsed={ctxUsed} ctxMax={model.ctx} coarse={coarse} taRef={taRef} />
  );

  const emptyHero = (
    <div className="text-center flex flex-col items-center gap-2 px-4">
      <span className="w-12 h-12 rounded-xl bg-iolite/10 c-accent inline-flex items-center justify-center kt-text-h2" aria-hidden="true"><Icon name="chat-bot" /></span>
      <h1 className="kt-text-h2 font-semibold ink mt-1">{t("emptyTitle", { model: prefs.model.split("-").slice(0, 2).join("-") })}</h1>
      <p className="kt-text-body ink-2 max-w-[46ch]">{t("emptyHint")}</p>
      <div className="mt-3 flex flex-wrap justify-center gap-2 max-w-xl" aria-label={t("startHint")}>
        {["q1", "q2", "q3"].map((k) => (
          <button key={k} type="button" onClick={() => { setDraft(t(k)); requestAnimationFrame(() => taRef.current && taRef.current.focus()); }}
            className="qs-chip">
            {t(k)}
          </button>
        ))}
      </div>
    </div>
  );

  const chatView = conv && (
    <div className="h-full flex flex-col min-h-0">
      {/* Header: desktop h-11, phone h-12 with menu + new chat */}
      <header className="h-12 md:h-11 px-1 md:px-4 flex items-center gap-1 md:gap-2 bg-v2-chrome border-b kt-v2-edge shrink-0">
        {isCompact && <button type="button" className="ib" onClick={() => setDrawer(true)} title={t("openMenu")} aria-label={t("openMenu")}><Icon name="menu" /></button>}
        <h1 className="kt-text-body font-semibold ink truncate flex-1 min-w-0" title={conv.title}>{conv.title || t("newChat")}</h1>
        {!isCompact && <span className="kt-chip font-mono num" title={t("temperature")}>T {prefs.temperature.toFixed(1)}</span>}
        {isCompact && <button type="button" className="ib" onClick={newChat} title={t("newChat")} aria-label={t("newChat")}><Icon name="add" /></button>}
      </header>
      {isEmpty && !isCompact ? (
        <div className="flex-1 min-h-0 overflow-y-auto bg-v2-canvas flex flex-col justify-center px-6">
          <div className="col max-w-[46rem] flex flex-col gap-6 -mt-10">
            {emptyHero}
            {composer}
            <p className="text-center kt-text-caption ink-2">{t("kbdHint")}</p>
          </div>
        </div>
      ) : (
        <>
          <div ref={scRef} onScroll={onScroll} className="flex-1 min-h-0 overflow-y-auto bg-v2-canvas relative">
            {isEmpty ? (
              <div className="h-full flex items-center justify-center py-8">{emptyHero}</div>
            ) : (
              <div ref={colRef} className="col px-4 md:px-6 py-6 flex flex-col gap-6">
                {conv.messages.map((m, i) => m.role === "user"
                  ? <UserMessage key={m.id} m={m} t={t} />
                  : <AssistantMessage key={m.id} m={m} t={t} lang={prefs.lang}
                      live={live && live.msgId === m.id} canRegenerate={!live && i === conv.messages.length - 1}
                      onRegenerate={() => regenerate(m.id)} />)}
              </div>
            )}
          </div>
          <div className="bg-v2-canvas shrink-0 relative">
            {showNew && (
              <button type="button" onClick={() => { follow.current = true; setShowNew(false); scRef.current.scrollTop = scRef.current.scrollHeight; }}
                className="absolute -top-11 left-1/2 -translate-x-1/2 h-8 px-3 rounded-full bg-aquamarine/15 border border-aquamarine/40 text-aquamarine-shadow dark:text-aquamarine-light kt-text-caption inline-flex items-center gap-1 bg-v2-card">
                <Icon name="arrow-down" />{t("newOutput")}
              </button>
            )}
            <div className="col px-3 md:px-6 pt-1 pb-3 safe-bottom md:pb-3">
              {composer}
              {!isCompact && <p className="mt-1.5 text-center kt-text-micro ink-2">{t("kbdHint")}</p>}
            </div>
          </div>
        </>
      )}
    </div>
  );

  return (
    <div className="h-full flex">
      {!isCompact && (
        <aside className="w-60 shrink-0 border-r kt-v2-edge">
          <Rail {...railProps} />
        </aside>
      )}
      {isCompact && drawer && (
        <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label={t("openMenu")}>
          <div className="absolute inset-0 bg-black/40" onClick={() => setDrawer(false)} />
          <div className="absolute inset-y-0 left-0 w-72 max-w-[85vw] border-r kt-v2-edge drawer-enter">
            <Rail {...railProps} onClose={() => setDrawer(false)} />
          </div>
        </div>
      )}
      <main className="flex-1 min-w-0 flex flex-col min-h-0 bg-v2-canvas">
        <div className="flex-1 min-h-0">
          {view === "settings"
            ? <SettingsView prefs={prefs} setPref={setPref} t={t} lang={prefs.lang} compactLayout={isCompact} onOpenMenu={() => setDrawer(true)} />
            : chatView}
        </div>
        {!isCompact && (
          <footer className="h-6 px-3 flex items-center gap-2 kt-text-micro font-mono bg-v2-chrome border-t kt-v2-edge ink-2 shrink-0">
            <span className="kt-dot kt-dot--live" role="img" aria-label={t("connected")} />
            <span>{t("connected")}</span>
            <span className="w-px h-3 bg-current opacity-15" />
            <span>llama.cpp · 127.0.0.1:8080</span>
            <span className="w-px h-3 bg-current opacity-15" />
            <span className="truncate" title={prefs.model}>{prefs.model}</span>
            <span className="flex-1" />
            <span className="num">ctx {fmt(prefs.lang).num.format(ctxUsed)} / {fmt(prefs.lang).num.format(model.ctx)}</span>
          </footer>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
